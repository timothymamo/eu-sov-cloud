version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
  settings:
    # Architecture rules. These are the dependency rule from docs/architecture.md,
    # enforced by the linter so no agent (or human) can quietly break the layering.
    depguard:
      rules:
        domain-is-pure:
          list-mode: strict
          files:
            - "**/internal/domain/**/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/timothymamo/eu-sov-cloud/internal/domain
        app-uses-ports-not-adapters:
          list-mode: lax
          files:
            - "**/internal/app/**/*.go"
          deny:
            - pkg: github.com/timothymamo/eu-sov-cloud/internal/adapter
              desc: the application layer depends on ports it declares; wire adapters in cmd/eusov
            - pkg: github.com/timothymamo/eu-sov-cloud/internal/cli
              desc: the application layer must not know about its driving adapter
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: cloud SDKs belong in internal/adapter/source/aws
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: cloud SDKs belong in internal/adapter/source/azure
            - pkg: cloud.google.com/go
              desc: cloud SDKs belong in internal/adapter/source/gcp
            - pkg: google.golang.org/api
              desc: cloud SDKs belong in internal/adapter/source/gcp
            # The assess path needs no network, process or OS access in the
            # application layer: adapters do I/O behind the ports.
            # depguard matches import paths exactly, so every subpackage is
            # listed. net/netip stays allowed: it is a pure value type.
            - pkg: net/http
              desc: the application layer makes no HTTP calls; an adapter behind a port does
            - pkg: net/rpc
              desc: the application layer makes no RPC calls; an adapter behind a port does
            - pkg: net/smtp
              desc: the application layer sends no mail; an adapter behind a port does
            - pkg: net/mail
              desc: the application layer parses no mail; an adapter behind a port does
            - pkg: net
              desc: the application layer has no network access; an adapter behind a port does
            - pkg: os/exec
              desc: the application layer starts no processes
            - pkg: os/user
              desc: the application layer looks up no OS users; the driving adapter passes what it needs through the ports
            - pkg: os/signal
              desc: the application layer handles no OS signals; the driving adapter cancels the context instead
            - pkg: os
              desc: the application layer has no OS access (files, environment); the driving adapter passes what it needs through the ports
        testutil-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/testutil/**"
          deny:
            - pkg: github.com/timothymamo/eu-sov-cloud/internal/testutil
              desc: testutil may only be imported from _test.go files
        contract-suites-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/adapter/source/sourcetest/**"
            - "!**/internal/adapter/target/targettest/**"
          deny:
            - pkg: github.com/timothymamo/eu-sov-cloud/internal/adapter/source/sourcetest
              desc: the source contract suite may only be imported from _test.go files
            - pkg: github.com/timothymamo/eu-sov-cloud/internal/adapter/target/targettest
              desc: the target contract suite may only be imported from _test.go files
        go-cmp-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/google/go-cmp
              desc: go-cmp is a test-only dependency
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104 # unchecked errors are already reported by errcheck
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/timothymamo/eu-sov-cloud
