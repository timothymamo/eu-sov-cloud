version: 2

project_name: shift2eu

builds:
  - id: shift2eu
    main: ./cmd/shift2eu
    binary: shift2eu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
