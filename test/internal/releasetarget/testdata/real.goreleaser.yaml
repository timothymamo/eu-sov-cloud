version: 2

project_name: shift2eu

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: shift2eu
    main: ./cmd/shift2eu
    binary: shift2eu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/shift2eu/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/shift2eu/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/shift2eu/internal/version.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
