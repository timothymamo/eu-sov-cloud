version: 2

project_name: eusov

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: eusov
    main: ./cmd/eusov
    binary: eusov
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
