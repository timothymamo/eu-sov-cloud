name: VM tools

# Two checks of dev/lima.yaml, the template of the agents' VM.
#
# validate-template: limactl validate, so a template Lima refuses to create an instance from fails the
# PR rather than the next `make vm-up` (#120, #122). Only creating an instance runs Lima's checks;
# restarting an existing VM does not, so nothing else notices. A warning counts as a refusal: Lima only
# warns on an unknown field. The job also proves the check can fail (#137): every template in
# dev/testdata/lima-invalid is dev/lima.yaml with one known breakage (#120's param read only through
# bash indirection, an unknown field, a mistyped value), and the job fails, naming the template, if
# Lima accepts one, or refuses it without the text its <name>.expect beside it holds (the reason Lima
# must give). test/devenv pins that each differs from dev/lima.yaml by its breakage alone and that its
# .expect holds its case's refusal. To add a case, add it to limaBreakages in test/devenv with the text
# of Lima's refusal and run `go test ./test/devenv -update`. Lima's log quotes the template, so the job
# prints it with workflow commands stopped.
#
# verify-pins: dev/lima.yaml pins cosign and gh by a SHA-256 per architecture, and provisioning trusts
# those pins: no trusted cosign or GitHub token exists there yet. This job is what makes a pin authentic. It
# downloads each pinned asset and checks it against its publisher's signature with tools that do not
# come from the release under test, then checks the pin equals the asset's digest (ADR 0017, "Verifying
# gh and cosign"). It runs on every pull request, so it can be a required status check without leaving
# other PRs waiting for it; until main's ruleset requires it, merge a change to the pins only when it is
# green. The weekly run catches a release asset replaced under a tag already pinned, which Renovate
# never reports: it fails here as a pin that no longer matches.
on:
  push:
    branches: [main]
    paths:
      - dev/lima.yaml
      - dev/testdata/lima-invalid/**
      - .github/workflows/vm-tools.yml
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays, with the Security workflow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    name: Validate the Lima template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Lima the dev environment documents (docs/dev-environment.md), so CI and developers agree on
      # what a valid template is. limactl validate needs no VM and no virtualisation.
      # renovate: datasource=github-releases depName=lima-vm/lima
      LIMA_VERSION: "v2.3.0"
      # SHA-256 of lima-<version>-Linux-x86_64.tar.gz, the runner's architecture. Renovate moves the
      # digestVersion and the digest together with LIMA_VERSION, in one PR.
      # renovate: datasource=github-release-attachments depName=lima-vm/lima digestVersion=v2.3.0
      LIMA_SHA256: "cc8ba97f1c801b899f7c9eda9919dfc4ce4fa2c140c53e5add15aa2d0a1936f9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Lima
        run: |
          set -euo pipefail
          name="lima-${LIMA_VERSION#v}-Linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${name}" \
            "https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}/${name}"
          if ! echo "${LIMA_SHA256}  ${RUNNER_TEMP}/${name}" | sha256sum -c --strict -; then
            echo "::error file=.github/workflows/vm-tools.yml::${name} does not match LIMA_SHA256"
            exit 1
          fi
          # The whole tarball: limactl resolves the template's base (template:_images/...) from the
          # share/lima next to its bin.
          mkdir -p "${RUNNER_TEMP}/lima"
          tar -xzf "${RUNNER_TEMP}/${name}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"
      - name: limactl validate dev/lima.yaml and the broken templates
        run: |
          set -euo pipefail
          limactl --version
          # What the last validate saw: limactl validate's exit status and its JSON log.
          status=0
          log=""
          # Runs limactl validate on <template> and prints its log. Lima's messages quote the template, so
          # a line of it could read as a workflow command (::add-mask::, ::stop-commands::, ::error ...): the
          # log is printed between ::stop-commands:: markers with a random token, so the runner runs none of
          # it. Nothing the job prints outside that region carries template, log or .expect text: its own
          # lines name only files, and only once their names are checked. An empty line is skipped; a line
          # that is not a JSON object is printed as it is, as an unparsed one.
          validate() { # <template>
            local token
            status=0
            log="$(limactl --log-format json validate "$1" 2>&1)" || status=$?
            token="$(openssl rand -hex 16)"
            echo "::stop-commands::${token}"
            jq -Rr 'select(. != "") | ((fromjson? | objects) // {level: "unparsed", msg: .})
              | "  \(.level // "unparsed"): \(.msg // "" | tostring)"
              + (if .error != null then "\n" + (.error | tostring | split("\n") | map("    " + .) | join("\n"))
                 else "" end)' <<<"${log}" || echo "  (the log could not be printed)"
            echo "::${token}::"
          }
          # Whether Lima accepted the last template: limactl validate exited 0 and logged nothing above
          # info. Lima 2.3 only warns on an unknown field ("Non-strict YAML detected"), so a misspelt key
          # would pass on the exit status alone. A line that is not a JSON object counts as a warning.
          accepted() {
            [ "${status}" -eq 0 ] && jq -Rse '[split("\n")[] | select(. != "")
              | ((fromjson? | objects) // {level: "unparsed"}) | .level]
              | all(. == "info" or . == "debug" or . == "trace")' <<<"${log}" >/dev/null 2>&1
          }
          # Whether the last log holds <text>, as a fixed string, in a message or an error. Matched on the
          # decoded fields, not the JSON line, where Lima's quotes are escaped.
          logged() { # <text>
            jq -Rse --arg want "$1" '[split("\n")[] | select(. != "")
              | ((fromjson? | objects) // {msg: .}) | .msg, .error | select(. != null)
              | tostring | contains($want)] | any' <<<"${log}" >/dev/null 2>&1
          }
          failed=0
          echo "dev/lima.yaml, which Lima must accept:"
          validate dev/lima.yaml
          if ! accepted; then
            echo "::error file=dev/lima.yaml::limactl validate refuses dev/lima.yaml or warns about it"
            failed=1
          fi
          # Each broken template is dev/lima.yaml with one breakage (test/devenv pins that), so with
          # dev/lima.yaml accepted, a refusal can only come from that breakage; its .expect pins which
          # refusal, so a template Lima starts refusing for another reason fails too.
          shopt -s nullglob
          broken=(dev/testdata/lima-invalid/*.yaml)
          if [ "${#broken[@]}" -eq 0 ]; then
            echo "::error file=.github/workflows/vm-tools.yml::no broken templates in dev/testdata/lima-invalid"
            exit 1
          fi
          for template in "${broken[@]}"; do
            # The name goes into ::error annotations and the log, so it must not be able to carry a
            # workflow command or an annotation property: it is not printed unless it is a plain one.
            if ! [[ "${template}" =~ ^dev/testdata/lima-invalid/[a-z0-9-]+\.yaml$ ]]; then
              echo "::error file=.github/workflows/vm-tools.yml::a template in dev/testdata/lima-invalid is not named [a-z0-9-]+.yaml"
              failed=1
              continue
            fi
            # Regular files only: a symlink would point limactl, or the read of the .expect, at any file
            # on the runner.
            if [ ! -f "${template}" ] || [ -L "${template}" ]; then
              echo "::error file=${template}::${template} must be a regular file, not a symlink or anything else"
              failed=1
              continue
            fi
            expect="${template%.yaml}.expect"
            expected=""
            if [ -L "${expect}" ] || { [ -e "${expect}" ] && [ ! -f "${expect}" ]; }; then
              echo "::error file=${template}::${expect} must be a regular file, not a symlink or anything else"
              failed=1
            else
              if [ -f "${expect}" ]; then
                # An unreadable .expect reads as empty, so the error below names it.
                expected="$(<"${expect}")" || expected=""
              fi
              # One line, so it can neither start a workflow command in the log nor match across lines.
              if [ -z "${expected}" ] || [[ "${expected}" == *[$'\r\n']* ]]; then
                echo "::error file=${template}::${expect} is missing, unreadable, empty or more than one line: it must hold the text Lima's refusal of ${template} contains"
                failed=1
                expected=""
              fi
            fi
            echo "${template}, which Lima must refuse:"
            validate "${template}"
            if accepted; then
              echo "::error file=${template}::limactl validate accepts ${template}, a template it must refuse: the check would not catch this breakage in dev/lima.yaml"
              failed=1
            elif [ -z "${expected}" ]; then
              : # Refused, but for a reason nothing pins: already an error above.
            elif logged "${expected}"; then
              echo "  refused with the text ${expect} holds, as it must be"
            else
              echo "::error file=${template}::limactl validate refuses ${template}, but its log above does not contain the text ${expect} holds: it is refused for another reason"
              failed=1
            fi
          done
          exit "${failed}"

  verify-pins:
    name: Verify the gh and cosign pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gh attestation verify reads cli/cli's attestations through the GitHub API with GITHUB_TOKEN.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action's own cosign, pinned by digest in sigstore/cosign-installer, is independent of the
      # cosign release dev/lima.yaml pins: a replaced release fails its signature check below.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify every pinned asset
        env:
          # The runner's preinstalled gh, not the release under test.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Sets REPLY to param <name> of dev/lima.yaml, read as YAML under the top-level param: key (a line
          # match would also take a same-named key elsewhere, which Lima ignores). The value must be a
          # string matching <regex>. Not called in $(...), so the error reaches the log and exit stops the step.
          param() { # <name> <regex> <what it should be>
            if ! REPLY="$(yq -e ".param.${1} | select(tag == \"!!str\")" dev/lima.yaml 2>/dev/null)"; then
              echo "::error file=dev/lima.yaml::param ${1} is missing or not a string"
              exit 1
            fi
            if ! [[ "${REPLY}" =~ $2 ]]; then
              # The value itself is not printed: it could hold a newline and a workflow command.
              echo "::error file=dev/lima.yaml::param ${1} is not ${3}"
              exit 1
            fi
          }
          sha256='^[0-9a-f]{64}$'
          version='^v[0-9]+\.[0-9]+\.[0-9]+$'
          failed=0
          # <file> <param>: the file's SHA-256 must be the pinned one.
          check_pin() {
            local want got
            param "$2" "${sha256}" "a SHA-256 in lowercase hex"
            want="${REPLY}"
            got="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ "${got}" = "${want}" ]; then
              echo "$(basename "$1"): ${2} matches"
            else
              echo "::error file=dev/lima.yaml::${2} is ${want}, but the verified $(basename "$1") has SHA-256 ${got}"
              failed=1
            fi
          }
          param cosignVersion "${version}" "a release tag like v1.2.3"
          cosign_version="${REPLY}"
          param ghVersion "${version}" "a release tag like v1.2.3"
          gh_version="${REPLY}"
          cosign version
          gh --version
          yq --version
          # cli/cli builds a release by dispatching its deployment workflow on trunk, so the attestation's
          # source ref is refs/heads/trunk, never the tag. What binds it to the release is the commit:
          # the attestation's source digest must be the commit the release tag names.
          if ! gh_commit="$(gh api "repos/cli/cli/commits/refs/tags/${gh_version}" --jq .sha)" ||
            ! [[ "${gh_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=dev/lima.yaml::cannot resolve cli/cli tag ${gh_version} to a commit (ghVersion)"
            exit 1
          fi
          echo "cli/cli ${gh_version} is commit ${gh_commit}"
          for arch in amd64 arm64; do
            Arch="${arch^}"
            dir="${RUNNER_TEMP}/${arch}"
            mkdir -p "${dir}"

            asset="cosign-linux-${arch}"
            base="https://github.com/sigstore/cosign/releases/download/${cosign_version}"
            curl -fsSL --retry 3 -o "${dir}/${asset}" "${base}/${asset}"
            curl -fsSL --retry 3 -o "${dir}/${asset}.sigstore.json" "${base}/${asset}.sigstore.json"
            if cosign verify-blob --bundle "${dir}/${asset}.sigstore.json" \
              --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
              --certificate-oidc-issuer https://accounts.google.com "${dir}/${asset}"; then
              check_pin "${dir}/${asset}" "cosignSha256${Arch}"
            else
              echo "::error file=dev/lima.yaml::cosign ${cosign_version}: ${asset} is not signed by sigstore/cosign's release identity (cosignSha256${Arch})"
              failed=1
            fi

            name="gh_${gh_version#v}_linux_${arch}.tar.gz"
            curl -fsSL --retry 3 -o "${dir}/${name}" \
              "https://github.com/cli/cli/releases/download/${gh_version}/${name}"
            if gh attestation verify "${dir}/${name}" -R cli/cli \
              --signer-workflow cli/cli/.github/workflows/deployment.yml \
              --source-ref refs/heads/trunk --source-digest "${gh_commit}" \
              --deny-self-hosted-runners; then
              check_pin "${dir}/${name}" "ghSha256${Arch}"
            else
              echo "::error file=dev/lima.yaml::gh ${gh_version}: ${name} has no valid build attestation from cli/cli's release workflow at commit ${gh_commit} (ghSha256${Arch})"
              failed=1
            fi
          done
          exit "${failed}"
