name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint type-checks only the files that build for the platform it lints, so every target the release
  # builds gets a run of its own (issue #39): one per goos/goarch in .goreleaser.yaml with cgo off, which
  # the cgo "0" entries must match, plus the runner's native run with cgo on, which make test's -race
  # build compiles.
  lint-target:
    name: Lint ${{ matrix.goos }}/${{ matrix.goarch }} cgo=${{ matrix.cgo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, cgo: "0" }
          - { goos: linux, goarch: arm64, cgo: "0" }
          - { goos: darwin, goarch: amd64, cgo: "0" }
          - { goos: darwin, goarch: arm64, cgo: "0" }
          - { goos: windows, goarch: amd64, cgo: "0" }
          - { goos: windows, goarch: arm64, cgo: "0" }
          - { goos: linux, goarch: amd64, cgo: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cache: false, as the cache key names only the runner OS and go.sum: an entry would save a cache
      # shared with the Test job that lacks the -race build output Test restores it for.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The action downloads the golangci-lint binary for the runner's own platform, whatever GOOS and
      # GOARCH say. Its cache key names only the runner OS, a 7-day interval and go.mod, so every entry would
      # restore one shared cache, and an entry of one target can hide another target's issues:
      # skip-cache leaves each entry the empty cache of its own runner. The build settings are make lint's:
      # the levels the release builds at, no -tags of the go env file's, no workspace and no experiment.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          GOFLAGS: -mod=readonly
          GOAMD64: v1
          GOARM64: v8.0
          GOWORK: "off"
          GOEXPERIMENT: ""
        with:
          version: v2.15.0
          skip-cache: true
      # The rules in test/lint, and the probes that run the golangci-lint installed above to prove forbidigo's
      # groups fire. The step sets no platform, so test/lint runs natively in every entry: the per-target
      # settings live in the golangci-lint step's own env: only. It runs once per matrix entry, seven times with
      # the same inputs, because the architecture test (cilint_test.go) forbids if: on a lint-target step.
      - name: Source rules and lint probes
        run: go test -count=1 ./test/lint/
        env:
          SHIFT2EU_LINT_PROBES: require

  # shellcheck on every shell script git tracks, and actionlint on the workflows, which hands their run:
  # scripts to the same shellcheck (issue #164, ADR 0022), as make lint runs them. Neither depends on the
  # target, so they run once, in a job of their own that the Lint check needs. shellcheck is the release
  # dev/lima.yaml pins, at the same version and SHA-256 (test/architecture holds the two pins equal), never
  # the runner's preinstalled one; actionlint is the tool go.mod pins, verified by go.sum.
  lint-shell:
    name: Lint shell scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: "v0.11.0"
      # SHA-256 of shellcheck-<version>.linux.x86_64.tar.gz, the runner's architecture: dev/lima.yaml's
      # shellcheckSha256Amd64. Renovate moves digestVersion and the digest together with the version.
      # renovate: datasource=github-release-attachments depName=koalaman/shellcheck digestVersion=v0.11.0
      SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cache: false, as lint-target's: an entry saved here would be the one the Test job restores.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the pinned shellcheck
        run: |
          set -euo pipefail
          if ! [[ "${SHELLCHECK_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.github/workflows/ci.yml::SHELLCHECK_VERSION is not a release tag like v1.2.3"
            exit 1
          fi
          name="shellcheck-${SHELLCHECK_VERSION}"
          asset="${name}.linux.x86_64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          if ! echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c --strict -; then
            echo "::error file=.github/workflows/ci.yml::${asset} does not match SHELLCHECK_SHA256"
            exit 1
          fi
          tar -C "${RUNNER_TEMP}" --no-same-owner -xzf "${RUNNER_TEMP}/${asset}"
          mkdir -p "${RUNNER_TEMP}/shellcheck-bin"
          install -m 0755 "${RUNNER_TEMP}/${name}/shellcheck" "${RUNNER_TEMP}/shellcheck-bin/shellcheck"
          echo "${RUNNER_TEMP}/shellcheck-bin" >> "${GITHUB_PATH}"
      # The pinned shellcheck must be the one on the PATH: actionlint runs whichever it finds there.
      - name: shellcheck the tracked shell scripts
        run: |
          set -euo pipefail
          if [ "$(command -v shellcheck)" != "${RUNNER_TEMP}/shellcheck-bin/shellcheck" ]; then
            echo "::error file=.github/workflows/ci.yml::the shellcheck on the PATH is not the pinned one"
            exit 1
          fi
          shellcheck --version
          dev/shellcheck.sh
      - name: actionlint the workflows
        run: go tool actionlint

  # Lint is a required status check, and a matrix reports one check per entry under its own name: this
  # job reports the whole matrix, and lint-shell, as the one Lint check, and fails unless every entry and
  # lint-shell succeeded. It runs after a failed or skipped job too, but not in a run cancelled by a newer
  # push.
  lint:
    name: Lint
    needs: [lint-target, lint-shell]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every lint target passed
        env:
          RESULT: ${{ needs.lint-target.result }}
          SHELL_RESULT: ${{ needs.lint-shell.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "lint-target finished with result '$RESULT', want 'success'" >&2
            exit 1
          fi
          if [ "$SHELL_RESULT" != "success" ]; then
            echo "lint-shell finished with result '$SHELL_RESULT', want 'success'" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Unit and contract tests
        run: make cover
      - name: Build
        run: make build
      - name: End-to-end tests
        run: make test-e2e
      # The same goreleaser version release.yml runs, installed only: the script below runs a snapshot of
      # the release at this commit, which builds the archives and publishes nothing.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.1" # exact pin, as release.yml's; Renovate updates it (github-actions manager)
          install-only: true
      # The release's archives, built by a snapshot run of its GoReleaser
      # configuration: each holds exactly its own binary (issue #147).
      - name: Each archive holds its own binary
        run: .github/scripts/verify-archives.sh

  # The dry run of release-please.yml (issues #142 and #157, ADR 0021): its guard, tag and relabel steps'
  # own scripts, read from the workflow, run against a fake gh with canned API responses, so a change to
  # how the tag's version is read and validated, to when the step refuses to tag, to the outputs it hands
  # the relabel job, or to when that job refuses to relabel, fails the pull request. Nothing reaches the
  # network; the workflow's shape and permissions are held by check.ReleasePleaseWorkflow.
  release-please:
    name: Release please dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and guard scripts on sample API responses
        run: .github/scripts/release-please-dry-run.sh

  # Builds the container images for both release platforms without pushing them, then
  # smoke-tests the amd64 images: a broken Dockerfile fails the pull request. It is
  # also the dry run of release.yml's image and sbom jobs (ADR 0015): the same latest
  # and tag rules for sample tags, the same build settings, and the SBOM of the built
  # image, for the CLI's image and for the HTTP API's (the server stage, PRD #103),
  # whose tag rules release.yml's check pins to the CLI's. Pushing, signing and the
  # attestations need write access and an OIDC token, so only a tag runs them.
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: shift2eu:ci
      SERVER_IMAGE: shift2eu-server:ci
      # The BuildKit image setup-buildx-action runs, pinned by tag and multi-arch index digest.
      # renovate: datasource=docker depName=moby/buildkit versioning=semver
      BUILDKIT_VERSION: v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build arguments from git, as make build takes them
        id: meta
        run: |
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      # No QEMU: the builder stage runs on the runner's platform and cross-compiles, and the final
      # stage runs nothing, so linux/arm64 builds without emulation (ADR 0013).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:${{ env.BUILDKIT_VERSION }}
      # release.yml's latest rule, on sample tag lists in place of its git tag -l --merged
      # refs/remotes/origin/main: each list stands for the tags on main, and the same sed, sort and
      # tail pick the highest. latest moves only for the highest release tag, pre-releases left out.
      - name: Latest for sample tags, as release.yml decides it
        id: latest
        run: |
          # $1 is the pushed tag, the rest every tag merged into main.
          decide() {
            TAG="$1"
            shift
            highest="$(printf '%s\n' "$@" | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -n 1)"
            latest=false
            if [ "$TAG" = "$highest" ]; then latest=true; fi
            echo "$latest"
          }
          {
            echo "highest=$(decide v1.2.3 v1.1.0 v1.2.2 v1.2.3 v1.3.0-rc.1)"
            echo "older=$(decide v1.2.3 v1.2.2 v1.2.3 v1.10.0)"
            echo "prerelease=$(decide v1.2.3-rc.1 v1.2.2 v1.2.3-rc.1)"
          } >> "$GITHUB_OUTPUT"
      # release.yml's tag rules, each given a sample tag in place of the pushed one: the highest
      # release gets vX.Y.Z, X.Y and latest, an older line's release no latest, a pre-release its
      # own tag only.
      - name: Image tags for a sample release tag, the highest
        id: tags-release
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/timothymamo/shift2eu
          flavor: latest=${{ steps.latest.outputs.highest }}
          tags: |
            type=semver,pattern={{raw}},value=v1.2.3
            type=semver,pattern={{major}}.{{minor}},value=v1.2.3,enable=${{ !contains('v1.2.3', '-') }}
      - name: Image tags for a sample release tag on an older line
        id: tags-older
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/timothymamo/shift2eu
          flavor: latest=${{ steps.latest.outputs.older }}
          tags: |
            type=semver,pattern={{raw}},value=v1.2.3
            type=semver,pattern={{major}}.{{minor}},value=v1.2.3,enable=${{ !contains('v1.2.3', '-') }}
      - name: Image tags for a sample pre-release tag
        id: tags-prerelease
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/timothymamo/shift2eu
          flavor: latest=${{ steps.latest.outputs.prerelease }}
          tags: |
            type=semver,pattern={{raw}},value=v1.2.3-rc.1
            type=semver,pattern={{major}}.{{minor}},value=v1.2.3-rc.1,enable=${{ !contains('v1.2.3-rc.1', '-') }}
      - name: The tags each sample gets
        env:
          RELEASE: ${{ steps.tags-release.outputs.tags }}
          OLDER: ${{ steps.tags-older.outputs.tags }}
          PRERELEASE: ${{ steps.tags-prerelease.outputs.tags }}
        run: |
          check() {
            got="$(printf '%s\n' "$2" | sed '/^$/d' | sort)"
            want="$(printf '%s\n' "$3" | sort)"
            echo "$1: $(printf '%s\n' "$got" | tr '\n' ' ')"
            if [ "$got" != "$want" ]; then
              echo "$1: want $(printf '%s\n' "$want" | tr '\n' ' ')" >&2
              exit 1
            fi
          }
          image=ghcr.io/timothymamo/shift2eu
          check release "$RELEASE" "$image:v1.2.3
          $image:1.2
          $image:latest"
          check older-line "$OLDER" "$image:v1.2.3
          $image:1.2"
          check pre-release "$PRERELEASE" "$image:v1.2.3-rc.1"
      # The settings of release.yml's push, written to an OCI archive instead of a registry.
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/shift2eu.oci.tar
          tags: ${{ steps.tags-release.outputs.tags }}
          annotations: index:org.opencontainers.image.source=https://github.com/timothymamo/shift2eu
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: SBOM of the built image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: oci-archive:${{ runner.temp }}/shift2eu.oci.tar
          format: spdx-json
          output-file: ${{ runner.temp }}/shift2eu.spdx.json
          upload-artifact: false
          upload-release-assets: false
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.1
      - name: The SBOM is SPDX and lists shift2eu
        env:
          SBOM: ${{ runner.temp }}/shift2eu.spdx.json
        run: |
          jq -r '.spdxVersion, (.packages | length | "\(.) packages")' "$SBOM"
          jq -e '.spdxVersion == "SPDX-2.3"' "$SBOM" > /dev/null
          jq -e 'any(.packages[]; .name == "github.com/timothymamo/shift2eu")' "$SBOM" > /dev/null
      - name: Load linux/amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Runs as a non-root user
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "user: $user"
          case "${user%%:*}" in
            ""|root|0) echo "the image runs as root" >&2; exit 1 ;;
          esac
      # release.yml's verify job runs the published image the same way, so the
      # dry run runs the image it built the same way (check.DryRunMirrorsRelease).
      - name: Smoke test, read-only root filesystem, no network
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          docker run --rm --read-only --network none "$IMAGE" version | tee version.txt
          grep -F "$COMMIT" version.txt
          docker run --rm --read-only --network none \
            -v "$PWD/test/e2e/testdata:/work:ro" \
            "$IMAGE" assess --inventory /work/inventory.json --target scaleway > report.md
          head -n 20 report.md
          test -s report.md
      - name: Image contents and history
        run: |
          docker history --no-trunc "$IMAGE"
          id="$(docker create "$IMAGE")"
          docker export "$id" | tar -tv
          docker rm "$id"
      - name: Image size
        run: |
          {
            echo "### Container image (linux/amd64)"
            echo
            echo "Size: $(docker image inspect -f '{{.Size}}' "$IMAGE") bytes"
            echo
            echo '```'
            docker images "$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The HTTP API's image, the Dockerfile's server stage, with the settings of release.yml's
      # server-image push, written to an OCI archive instead of a registry.
      - name: Build the server image, linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/shift2eu-server.oci.tar
          tags: ghcr.io/timothymamo/shift2eu-server:v1.2.3
          annotations: index:org.opencontainers.image.source=https://github.com/timothymamo/shift2eu
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: SBOM of the built server image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: oci-archive:${{ runner.temp }}/shift2eu-server.oci.tar
          format: spdx-json
          output-file: ${{ runner.temp }}/shift2eu-server.spdx.json
          upload-artifact: false
          upload-release-assets: false
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.1
      - name: The server SBOM is SPDX and lists shift2eu
        env:
          SBOM: ${{ runner.temp }}/shift2eu-server.spdx.json
        run: |
          jq -r '.spdxVersion, (.packages | length | "\(.) packages")' "$SBOM"
          jq -e '.spdxVersion == "SPDX-2.3"' "$SBOM" > /dev/null
          jq -e 'any(.packages[]; .name == "github.com/timothymamo/shift2eu")' "$SBOM" > /dev/null
      - name: Load the server image, linux/amd64, for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: ${{ env.SERVER_IMAGE }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: The server image runs as a non-root user
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' "$SERVER_IMAGE")"
          echo "user: $user"
          case "${user%%:*}" in
            ""|root|0) echo "the server image runs as root" >&2; exit 1 ;;
          esac
      # release.yml's verify job runs the published server image the same way:
      # it has no version subcommand, so --help exiting 0 is the smoke test.
      - name: The server image answers --help, read-only root filesystem, no network
        run: |
          docker run --rm --read-only --network none "$SERVER_IMAGE" --help > /dev/null
      # The image listens on 0.0.0.0:8080 by default (its CMD), so without a token it refuses to
      # start (exit 2, with the refusal on stderr); timeout ends the run with 124 if a regression
      # lets it start instead, so the step fails rather than hangs. With a token, on a read-only root filesystem, with
      # no capabilities and no privilege escalation (the flags in docs/guide/reverse-proxy.md), it answers the health
      # checks, refuses a request without the token and assesses one with it. The token is random,
      # masked in the log, lives for this step and reaches curl on stdin, never in its argv.
      - name: Smoke test the server, read-only root filesystem
        run: |
          set +e
          timeout 30 docker run --rm --name shift2eu-refusal --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network none "$SERVER_IMAGE" 2> refusal.txt
          code=$?
          set -e
          cat refusal.txt
          if [ "$code" -eq 124 ]; then
            docker rm -f shift2eu-refusal > /dev/null 2>&1 || true
            echo "the server started without a token (still running after 30s)" >&2
            exit 1
          fi
          if [ "$code" -ne 2 ]; then
            echo "the server started off loopback without a token (exit $code)" >&2
            exit 1
          fi
          if ! grep -q 'refusing to listen on the non-loopback address 0.0.0.0:8080 without a bearer token' refusal.txt; then
            echo "the server exited 2 without refusing for want of a token" >&2
            exit 1
          fi
          SHIFT2EU_SERVER_TOKEN="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::add-mask::$SHIFT2EU_SERVER_TOKEN"
          export SHIFT2EU_SERVER_TOKEN
          docker run -d --name shift2eu-server --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:8080:8080 -e SHIFT2EU_SERVER_TOKEN "$SERVER_IMAGE"
          trap 'docker logs shift2eu-server; docker rm -f shift2eu-server > /dev/null' EXIT
          url=http://127.0.0.1:8080
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$url/healthz"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 "$url/readyz"
          jq -c '{inventory: ., targets: ["scaleway"]}' test/e2e/testdata/inventory.json > request.json
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @request.json "$url/v1/assessments")"
          if [ "$status" != 401 ]; then
            echo "a request without the token got $status, want 401" >&2
            exit 1
          fi
          printf 'Authorization: Bearer %s\n' "$SHIFT2EU_SERVER_TOKEN" |
            curl -fsS -X POST -H @- \
              -H 'Content-Type: application/json' -H 'Accept: text/markdown' \
              --data-binary @request.json "$url/v1/assessments" > report.md
          head -n 20 report.md
          test -s report.md
