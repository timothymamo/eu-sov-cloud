name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint type-checks only the files that build for the platform it lints, so every target the release
  # builds gets a run of its own (issue #39): one per goos/goarch in .goreleaser.yaml with cgo off, which
  # the cgo "0" entries must match, plus the runner's native run with cgo on, which make test's -race
  # build compiles.
  lint-target:
    name: Lint ${{ matrix.goos }}/${{ matrix.goarch }} cgo=${{ matrix.cgo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, cgo: "0" }
          - { goos: linux, goarch: arm64, cgo: "0" }
          - { goos: darwin, goarch: amd64, cgo: "0" }
          - { goos: darwin, goarch: arm64, cgo: "0" }
          - { goos: windows, goarch: amd64, cgo: "0" }
          - { goos: windows, goarch: arm64, cgo: "0" }
          - { goos: linux, goarch: amd64, cgo: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cache: false, as the cache key names only the runner OS and go.sum: an entry would save a cache
      # shared with the Test job that lacks the -race build output Test restores it for.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The action downloads the golangci-lint binary for the runner's own platform, whatever GOOS and
      # GOARCH say. Its cache key names only the runner OS, a 7-day interval and go.mod, so every entry would
      # restore one shared cache, and an entry of one target can hide another target's issues:
      # skip-cache leaves each entry the empty cache of its own runner. The build settings are make lint's:
      # the levels the release builds at, no -tags of the go env file's, no workspace and no experiment.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          GOFLAGS: -mod=readonly
          GOAMD64: v1
          GOARM64: v8.0
          GOWORK: "off"
          GOEXPERIMENT: ""
        with:
          version: v2.15.0
          skip-cache: true

  # Lint is a required status check, and a matrix reports one check per entry under its own name: this
  # job reports the whole matrix as the one Lint check, and fails unless every entry succeeded. It runs
  # after a failed or skipped entry too, but not in a run cancelled by a newer push.
  lint:
    name: Lint
    needs: lint-target
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every lint target passed
        env:
          RESULT: ${{ needs.lint-target.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "lint-target finished with result '$RESULT', want 'success'" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Unit and contract tests
        run: make cover
      - name: Build
        run: make build
      - name: End-to-end tests
        run: make test-e2e

  # Builds the container image for both release platforms without pushing it, then
  # smoke-tests the amd64 image: a broken Dockerfile fails the pull request.
  image:
    name: Container image
    runs-on: ubuntu-latest
    env:
      IMAGE: eusov:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build arguments from git, as make build takes them
        id: meta
        run: |
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Load linux/amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Runs as a non-root user
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "user: $user"
          case "${user%%:*}" in
            ""|root|0) echo "the image runs as root" >&2; exit 1 ;;
          esac
      - name: Smoke test, read-only root filesystem
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          docker run --rm --read-only "$IMAGE" version | tee version.txt
          grep -F "$COMMIT" version.txt
          docker run --rm --read-only --network none \
            -v "$PWD/test/e2e/testdata:/work:ro" \
            "$IMAGE" assess --inventory /work/inventory.json --target scaleway > report.md
          head -n 20 report.md
          test -s report.md
      - name: Image contents and history
        run: |
          docker history --no-trunc "$IMAGE"
          id="$(docker create "$IMAGE")"
          docker export "$id" | tar -tv
          docker rm "$id"
      - name: Image size
        run: |
          {
            echo "### Container image (linux/amd64)"
            echo
            echo "Size: $(docker image inspect -f '{{.Size}}' "$IMAGE") bytes"
            echo
            echo '```'
            docker images "$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
