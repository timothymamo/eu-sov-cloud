name: Release please

# Proposes the next release in one release PR on main, and tags it when the PR merges (issues #142, #157
# and #159, ADR 0021). release-please computes the version from the Conventional Commits since the last
# release with the release-tag skill's rules (release-please-config.json) and keeps CHANGELOG.md. The tag
# it leads to starts .github/workflows/release.yml, which alone publishes, signs and attests, exactly as
# it did when the tag was pushed by hand. check.ReleasePleaseWorkflow pins this file.
#
# Two GitHub Apps split the writing, each held by an environment of its own, limited to main:
#   - the release-please App (environment release-please: RELEASE_APP_CLIENT_ID, RELEASE_APP_PRIVATE_KEY)
#     opens the release PR, labels it, and relabels it once it is tagged. It bypasses no v* tag ruleset
#     (only the release-please--branches--* branch ruleset allows it), so it cannot create a release tag.
#   - the release-tag App (environment release-tag: RELEASE_TAG_APP_CLIENT_ID, RELEASE_TAG_APP_PRIVATE_KEY)
#     creates the tag, in a job of its own that runs no third-party action. It is the only App that may
#     bypass the Release tag creation ruleset; its token holds Contents write and Pull requests read, so
#     it cannot write to a pull request.
# Both tokens hold Contents write, which is all merging a PR takes, and Protect main asks for no approving
# review, so either App could merge a PR once the required checks pass (ADR 0021, residual risk, tracked in
# the bot-account issue). That covers releases too: the split stops a tag on an arbitrary commit, not the
# release of a release PR an attacker merged with the release-please App's token.
# The tag job trusts no output of the release-please job, which runs the third-party release-please-action:
# it holds the release-please App's slug, shift2eu-release, as a constant.
# No job holds the other App's credentials. Both token steps pass client-id, never the deprecated app-id.
on:
  push:
    branches: [main]

# Nothing through GITHUB_TOKEN writes: the Apps' short-lived tokens do the writing.
permissions: {}

# A group of its own, never the release group release.yml uses: GitHub keeps one pending run per group
# and cancels the older pending one when a new run queues, so sharing that group would let a later push
# to main cancel a release waiting to run. A run in progress is never cancelled: it may be tagging.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the release-please App's RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY secret,
    # and is limited to main.
    environment: release-please
    # GITHUB_TOKEN reads only: the App's token does the writing.
    permissions:
      contents: read
    # No outputs: the jobs after it trust nothing the third-party release-please-action could write.
    steps:
      # A token of the release-please App, revoked when the job ends, with exactly what release-please
      # needs: Contents write (the release branch) and Pull requests write (the release PR and its labels;
      # the autorelease labels exist, so no Issues permission).
      - name: Mint the release-please App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Opens or updates the release PR, labelled autorelease: pending. With skip-github-release it
      # creates no GitHub Release and so no tag (GoReleaser creates the Release), and it opens no new
      # release PR while a merged one is still labelled autorelease: pending: the tag job creates that
      # PR's tag and the relabel job relabels it autorelease: tagged. Every input but token would override
      # release-please-config.json, so none is set.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}

  tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-please
    # Holds the release-tag App's RELEASE_TAG_APP_CLIENT_ID variable and RELEASE_TAG_APP_PRIVATE_KEY
    # secret, and is limited to main.
    environment: release-tag
    # GITHUB_TOKEN reads only: contents for the job, actions for the guard's read of release.yml's runs,
    # pull-requests for its read of the closed release PRs.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # The release PR this job tagged and its tag, empty when it tagged nothing, for the relabel job.
    outputs:
      pr: ${{ steps.tag.outputs.pr }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # A token of the release-tag App, revoked when the job ends: Contents write to create the tag, and
      # Pull requests read to check the merged release PR, nothing else. A tag the App creates starts
      # release.yml, where one created with GITHUB_TOKEN would start nothing, and only this App may bypass
      # the Release tag creation ruleset.
      - name: Mint the release-tag App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      # One release at a time: no tag while release.yml has a run requested, waiting, pending, queued or
      # in progress, since a tag pushed at a release run that GitHub then cancels publishes nothing
      # (ADR 0015). It waits only when there is something to tag, a merged release PR the release-please
      # App opened from release-please's branch still labelled autorelease: pending, read with the tag
      # step's own pulls query, so a push to main during a release with nothing to tag passes. The
      # release PR stays labelled autorelease: pending, so the next push to main, or a re-run of this
      # workflow once the release has finished, tags it. It reads with GITHUB_TOKEN, never an App's token.
      - name: Wait for no release to be queued or in progress
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: shift2eu-release
        run: |
          set -euo pipefail
          branch='release-please--branches--main--components--shift2eu'
          listed="$(gh api --paginate "repos/${GH_REPO}/pulls?state=closed&base=main&head=${GH_REPO%%/*}:${branch}&per_page=100" | jq -s 'add // []')"
          waiting="$(jq --arg author "${APP_SLUG}[bot]" '[.[] | select(.merged_at != null and .user.login == $author and any(.labels[]?; .name == "autorelease: pending"))] | length' <<<"${listed}")"
          if [ "${waiting}" = "0" ]; then
            echo "No merged release PR waits for its tag, so there is no release to wait for."
            exit 0
          fi
          for status in requested waiting pending queued in_progress; do
            runs="$(gh api "repos/${GH_REPO}/actions/workflows/release.yml/runs?status=${status}&per_page=1" --jq '.total_count')"
            if [ "${runs}" != "0" ]; then
              echo "::error::release.yml has ${runs} run(s) ${status}: nothing is tagged; re-run this workflow once the release has finished"
              exit 1
            fi
          done
      # Creates the annotated vX.Y.Z tag of the merged release PR still labelled autorelease: pending, on
      # that PR's merge commit, through the API with the release-tag App's token, and writes the PR's
      # number and the tag to its outputs, pr and tag, for the relabel job: this token cannot write to a
      # pull request, so it never labels. It lists the closed PRs into main from release-please's branch
      # through pulls, every page, never through issues, which neither App's token can read without Issues
      # read. Only one the release-please App opened (${APP_SLUG}[bot], shift2eu-release[bot], a constant
      # of this file) and merged, labelled autorelease: pending, is a candidate: a closed unmerged one, or
      # one by anyone else, keeps its label and is named in a warning, so a label set by hand can neither
      # release nor block a release.
      # It fails closed: several candidates, a PR not merged into main from release-please's branch
      # release-please--branches--main--components--shift2eu (release-please 17.6.0, the version
      # release-please-action v5.0.0 bundles, with one package named shift2eu), a PR that changes anything
      # but CHANGELOG.md and .release-please-manifest.json, a version that is not exactly X.Y.Z or that the
      # PR's title does not name, a merge commit not on main, or an existing tag on another commit stop
      # it. Pull request data reaches the shell through gh's output into quoted variables only, never
      # through an expression, and is quoted with printf %q in every message.
      - name: Tag the merged release PR
        id: tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: shift2eu-release
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          q() { printf '%q' "$1"; }
          pending='autorelease: pending'
          branch='release-please--branches--main--components--shift2eu'
          [[ "${APP_SLUG}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "the release-please App's slug $(q "${APP_SLUG}") is not a slug"
          author="${APP_SLUG}[bot]"

          listed="$(gh api --paginate "repos/${GH_REPO}/pulls?state=closed&base=main&head=${GH_REPO%%/*}:${branch}&per_page=100" | jq -s 'add // []')"
          labelled="$(jq -c --arg pending "${pending}" '[.[] | select(any(.labels[]?; .name == $pending))]' <<<"${listed}")"
          for pr in $(jq -r '.[] | select(.merged_at == null) | .number' <<<"${labelled}"); do
            echo "::warning::#${pr} is labelled ${pending} but was closed without merging: it is not tagged; remove its label"
          done
          for pr in $(jq -r --arg author "${author}" '.[] | select(.merged_at != null and .user.login != $author) | .number' <<<"${labelled}"); do
            echo "::warning::#${pr} is labelled ${pending} but was not opened by ${author}: it is not tagged; remove its label"
          done
          prs="$(jq -r --arg author "${author}" '.[] | select(.merged_at != null and .user.login == $author) | .number' <<<"${labelled}")"
          count="$(printf '%s' "${prs}" | grep -c . || true)"
          if [ "${count}" = "0" ]; then
            echo "No merged release PR waits for its tag."
            exit 0
          fi
          [ "${count}" = "1" ] || fail "${count} merged release PRs of ${author} are labelled ${pending}, want at most 1: remove the ${pending} label from all but one by hand"
          pr="${prs}"
          [[ "${pr}" =~ ^[0-9]+$ ]] || fail "pull request number $(q "${pr}") is not a number"

          pull="$(gh api "repos/${GH_REPO}/pulls/${pr}")"
          merged="$(jq -r '.merged' <<<"${pull}")"
          base="$(jq -r '.base.ref' <<<"${pull}")"
          head="$(jq -r '.head.ref' <<<"${pull}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pull}")"
          login="$(jq -r '.user.login' <<<"${pull}")"
          merge="$(jq -r '.merge_commit_sha' <<<"${pull}")"
          title="$(jq -r '.title' <<<"${pull}")"
          [ "${merged}" = "true" ] || fail "#${pr} is labelled ${pending} but was closed without merging"
          [ "${login}" = "${author}" ] || fail "#${pr} was opened by $(q "${login}"), want ${author}"
          [ "${base}" = "main" ] || fail "#${pr} was merged into $(q "${base}"), want main"
          [ "${head_repo}" = "${GH_REPO}" ] || fail "#${pr} comes from $(q "${head_repo}"), want ${GH_REPO}"
          [ "${head}" = "${branch}" ] || fail "#${pr} comes from $(q "${head}"), want release-please's branch ${branch}"
          [[ "${merge}" =~ ^[0-9a-f]{40}$ ]] || fail "#${pr} has merge commit $(q "${merge}"), want 40 hex characters"

          files="$(gh api "repos/${GH_REPO}/pulls/${pr}/files?per_page=100")"
          [ "$(jq 'length' <<<"${files}")" -le 2 ] || fail "#${pr} changes $(jq 'length' <<<"${files}") files, want only CHANGELOG.md and .release-please-manifest.json"
          jq -e 'all(.[]; (.filename == "CHANGELOG.md" or .filename == ".release-please-manifest.json") and .previous_filename == null) and any(.[]; .filename == ".release-please-manifest.json")' <<<"${files}" >/dev/null ||
            fail "#${pr} changes $(jq -c '[.[] | .filename, (.previous_filename // empty)]' <<<"${files}"), want CHANGELOG.md and .release-please-manifest.json only, the manifest among them"

          ancestry="$(gh api "repos/${GH_REPO}/compare/${merge}...main" --jq '.status')"
          [ "${ancestry}" = "identical" ] || [ "${ancestry}" = "ahead" ] || fail "#${pr}'s merge commit ${merge} is not on main ($(q "${ancestry}"))"

          version="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=${merge}" | jq -er '.["."]')"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail ".release-please-manifest.json at ${merge} holds version $(q "${version}"), want exactly X.Y.Z"
          tag="v${version}"
          [ "${title% "${version}"}" != "${title}" ] || fail "#${pr}'s title does not end in the manifest's version ${version}"

          existing="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${tag}" --jq "[.[] | select(.ref == \"refs/tags/${tag}\")] | length")"
          if [ "${existing}" = "0" ]; then
            object="$(gh api --method POST "repos/${GH_REPO}/git/tags" -f tag="${tag}" -f message="${tag}" -f object="${merge}" -f type=commit --jq '.sha')"
            [[ "${object}" =~ ^[0-9a-f]{40}$ ]] || fail "creating the tag object of ${tag} returned $(q "${object}")"
            gh api --method POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${object}" --silent
            echo "Created ${tag} on ${merge}, the merge commit of #${pr}."
          else
            # A run that created the tag but failed to relabel: hand it on only if the tag is this PR's.
            target="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type + " " + .object.sha')"
            if [ "${target%% *}" = "tag" ]; then
              annotated="${target#* }"
              [[ "${annotated}" =~ ^[0-9a-f]{40}$ ]] || fail "${tag} points at tag object $(q "${annotated}"), want 40 hex characters"
              target="$(gh api "repos/${GH_REPO}/git/tags/${annotated}" --jq '.object.type + " " + .object.sha')"
            fi
            [ "${target}" = "commit ${merge}" ] || fail "${tag} exists on $(q "${target#* }"), not on #${pr}'s merge commit ${merge}"
            echo "${tag} already exists on ${merge}; the relabel job relabels #${pr}."
          fi

          # Written also when the tag already existed on this merge commit, so a re-run finishes the
          # relabelling.
          echo "pr=${pr}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

  relabel:
    name: Relabel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, tag]
    # Only when the tag job tagged a PR, or found its tag already on that PR's merge commit.
    if: needs.tag.outputs.pr != ''
    # The release-please App labels the release PR, so it relabels it too: the release-tag App's token
    # cannot write to a pull request. Holds that App's variable and secret, and is limited to main.
    environment: release-please
    # GITHUB_TOKEN reads only: the App's token does the writing.
    permissions:
      contents: read
    steps:
      # The release-please App's token again, narrowed exactly as in the release-please job.
      - name: Mint the release-please App's token to relabel
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Labels the tagged release PR autorelease: tagged, then removes autorelease: pending. It trusts the
      # tag job's outputs no further than it checks them: the PR number and the vX.Y.Z tag must be well
      # formed, the PR merged, and the tag must point, through its annotated tag object, at that PR's
      # merge commit, or it relabels nothing. The outputs reach the shell through env: alone, quoted.
      - name: Relabel the tagged release PR
        id: relabel
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.tag.outputs.pr }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          q() { printf '%q' "$1"; }
          [[ "${PR}" =~ ^[0-9]+$ ]] || fail "pull request number $(q "${PR}") is not a number"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag $(q "${TAG}") is not exactly vX.Y.Z"

          pull="$(gh api "repos/${GH_REPO}/pulls/${PR}")"
          merged="$(jq -r '.merged' <<<"${pull}")"
          merge="$(jq -r '.merge_commit_sha' <<<"${pull}")"
          [ "${merged}" = "true" ] || fail "#${PR} is not merged"
          [[ "${merge}" =~ ^[0-9a-f]{40}$ ]] || fail "#${PR} has merge commit $(q "${merge}"), want 40 hex characters"

          target="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')"
          if [ "${target%% *}" = "tag" ]; then
            annotated="${target#* }"
            [[ "${annotated}" =~ ^[0-9a-f]{40}$ ]] || fail "${TAG} points at tag object $(q "${annotated}"), want 40 hex characters"
            target="$(gh api "repos/${GH_REPO}/git/tags/${annotated}" --jq '.object.type + " " + .object.sha')"
          fi
          [ "${target}" = "commit ${merge}" ] || fail "${TAG} is on $(q "${target#* }"), not on #${PR}'s merge commit ${merge}: nothing is relabelled"

          # Tagged first, then no longer pending: a run that stops between the two leaves both labels, and a
          # re-run finds the tag on this merge commit and finishes the relabelling.
          gh api --method POST "repos/${GH_REPO}/issues/${PR}/labels" -f "labels[]=autorelease: tagged" --silent
          gh api --method DELETE "repos/${GH_REPO}/issues/${PR}/labels/autorelease:%20pending" --silent
          echo "Relabelled #${PR} autorelease: tagged."
