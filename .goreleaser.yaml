version: 2

project_name: eusov

before:
  hooks:
    - go mod tidy

builds:
  - id: eusov
    main: ./cmd/eusov
    binary: eusov
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/eu-sov-cloud/internal/version.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
