version: 2

project_name: shift2eu

before:
  hooks:
    # -diff fails on an untidy module and writes nothing: the hook runs
    # outside the build env, and a rewritten go.mod or go.sum would pass the
    # -mod=readonly build (issue #102, ADR 0012).
    - go mod tidy -diff

builds:
  - id: shift2eu
    main: ./cmd/shift2eu
    binary: shift2eu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/shift2eu/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/shift2eu/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/shift2eu/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # The HTTP API (PRD #103, ADR 0019), built exactly as the CLI: the same env,
  # flags, ldflags and platforms. test/container and releasetarget.Read hold the
  # two entries to each other.
  - id: shift2eu-server
    main: ./cmd/shift2eu-server
    binary: shift2eu-server
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/shift2eu/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/shift2eu/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/shift2eu/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One archive per binary and platform, under the same tag and version (issue
# #147): ids limits each entry to its own build, so the CLI's archive holds
# shift2eu alone and keeps the name it has always had (goreleaser's default,
# written out), and the server's holds shift2eu-server alone, named
# shift2eu-server_<version>_<os>_<arch>. One checksums.txt covers every
# archive, so both are verified the same way (ADR 0015).
# test/architecture (check.GoReleaserArchives) pins this section and the
# checksum one, and ci.yml's test job builds a snapshot and checks each
# archive's binary (.github/scripts/verify-archives.sh).
#
# README.md links only to LICENSE and the pages under docs/ (test/docs holds
# it to that), so each archive ships docs/ beside it and the links work in an
# unpacked archive too (issue #149). docs/**/* matches only the files in
# docs/'s subdirectories, so docs/*.md takes those directly in it.
archives:
  - id: shift2eu
    ids: [shift2eu]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*.md
      - docs/**/*

  - id: shift2eu-server
    ids: [shift2eu-server]
    name_template: "{{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*.md
      - docs/**/*

# The bundled OpenAPI document is published beside the archives as
# shift2eu-server_openapi.json and listed in checksums.txt (issue #139).
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./api/openapi.bundled.json
      name_template: shift2eu-server_openapi.json

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Every asset goes to a draft release, which release.yml's publish job
# publishes after the archives are attested, so an immutable release never
# gains or loses an asset once it is public (issue #156, ADR 0015). A re-run
# of a failed goreleaser job replaces the draft the failed run left rather
# than add a second one. A tag with a pre-release suffix (v0.1.0-rc.2) is a
# GitHub pre-release, never the latest release, as its image gets no X.Y and
# no latest tag (ADR 0015, issue #92). test/architecture (check.GitHubRelease)
# pins this section.
release:
  draft: true
  prerelease: auto
  replace_existing_draft: true
  # The bundled OpenAPI document as a release asset (issue #139).
  extra_files:
    - glob: ./api/openapi.bundled.json
      name_template: shift2eu-server_openapi.json
