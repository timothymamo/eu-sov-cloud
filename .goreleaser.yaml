version: 2

project_name: shift2eu

before:
  hooks:
    # -diff fails on an untidy module and writes nothing: the hook runs
    # outside the build env, and a rewritten go.mod or go.sum would pass the
    # -mod=readonly build (issue #102, ADR 0012).
    - go mod tidy -diff

builds:
  - id: shift2eu
    main: ./cmd/shift2eu
    binary: shift2eu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/shift2eu/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/shift2eu/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/shift2eu/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# A tag with a pre-release suffix (v0.1.0-rc.2) is a GitHub pre-release, never
# the latest release, as its image gets no X.Y and no latest tag (ADR 0015,
# issue #92). test/architecture (check.GitHubRelease) pins this section.
release:
  prerelease: auto
